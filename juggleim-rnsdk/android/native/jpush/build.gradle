plugins { id 'com.android.library' }

def sdkModule = file('../../../native/imsdk-android/JGPlugin')

android {
    namespace 'com.juggle.im.push.jg'
    compileSdk 33
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile file("${sdkModule}/src/main/AndroidManifest.xml")
            java.srcDirs = [file("${sdkModule}/src/main/java")]
            res.srcDirs = [file("${sdkModule}/src/main/res")]
        }
    }
}

dependencies {
    implementation project(':juggle-im-core')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'cn.jiguang.sdk:jpush:5.2.4'
}
